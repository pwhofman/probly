defaults:
  - _self_
  - supervised_loss: cross_entropy
  - calibration: none
  - conformal: lac
  - recipe: ???
  - method: ???
  # Optional combo-specific overrides keyed on (method, recipe), as in train.yaml
  - optional override: ${method}_${recipe}

seed: 1
wandb:
  enabled: true
  entity: "probly"
  project: "test"

# models will always be saved in wandb, but this option controls whether they are also saved to disk
save_to_disk: false

amp: true
