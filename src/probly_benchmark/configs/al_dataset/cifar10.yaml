# @package _global_
dataset:
  name: "cifar10"

# ResNet18 on CIFAR-10: SGD + cosine is standard (He et al.)
# Random crop + horizontal flip matches the supervised recipe and the standard
# AL-on-CIFAR-10 protocol (Yoo and Kweon, CVPR 2019; Beck et al., arXiv:2106.15324).
train_augmentation: true
# 100 epochs per refit (the supervised recipe and Yoo and Kweon use 200) to halve
# compute; the shortening applies equally to every method, so the comparison is
# unaffected -- only absolute accuracies sit slightly below the literature curves.
epochs: 100
batch_size: 128
optimizer:
  name: "sgd"
  params:
    lr: 0.1
    momentum: 0.9
    weight_decay: 5e-4
scheduler:
  name: "cosine"
  params: {}

# CIFAR-10 has 50k train samples — can start with more labels
initial_size: 1000
query_size: 1000
n_iterations: 10
