# @package _global_

# Pretrained ImageNet models start from the timm checkpoint; resetting member
# parameters would discard the pretraining. Keep them.
method:
  params:
    reset_params: false

# The per-epoch relative-likelihood check is a full pass over the training set
# and costs as much as the epoch itself on ImageNet. Members never reach the
# threshold before the final epoch there, so only check the last one.
  train:
    check_last_epochs: 1
