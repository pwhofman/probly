# @package _global_

# pred_type="nn" (Monte-Carlo sampling) is required at ImageNet scale because
# the GLM Jacobian for last-layer Laplace is intractable here.
method:
  train:
    pred_type: "nn"
    # laplace-torch hard-requires link_approx="mc" whenever pred_type="nn"
    # (the closed-form probit/bridge approximations are GLM-only).
    link_approx: "mc"
    # KFAC stores per-sample 1000x1000 Hessian square roots; train batch (2048) OOMs.
    fit_batch_size: 32
    # As on CIFAR-10, the posterior is fit on the full train set and the prior grid is scored
    # on the full validation split: laplace-torch sums the KFAC factors over the samples it
    # sees, so fitting on a subset would shrink the data term by that fraction.
    # One validation pass (5000 images) per grid point; 20 points cut the gridsearch runtime about fivefold.
    prior_grid_size: 100
  # Downstream samplers must also use "nn" for the same intractability reason as `train`.
  selective_prediction:
    pred_type: "nn"
  ood_detection:
    pred_type: "nn"
  active_learning:
    pred_type: "nn"
