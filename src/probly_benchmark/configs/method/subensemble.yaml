# @package method
name: "subensemble"
label: "SubEnsemble"
params:
  num_heads: 10
  # Heads starts from independent random init. If false, all heads start from same params, and data order is only random
  reset_params: true
  # Head name resolved by `models.get_encoder_head`: "linear" (the default if omitted) or
  # "mlp_small" (FC-128 + output, the smallest task network of arXiv:1910.08168).
  head: "linear"
