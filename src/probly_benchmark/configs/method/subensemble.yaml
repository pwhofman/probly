# @package method
name: "subensemble"
label: "SubEnsemble"
params:
  num_heads: 10
  # Heads start from independent random init, as in Algorithm 1 of the deep
  # sub-ensembles reference (Valdenegro-Toro, arXiv:1910.08168). If false, all
  # heads start from the same params and diversity comes from data order only,
  # which collapses on the convex head objective.
  reset_params: true
  # Head name resolved by `models.get_encoder_head`. "mlp_small" (FC-128 + output)
  # mirrors the smallest task network of arXiv:1910.08168; a single linear layer
  # on frozen features is strictly convex and drives all heads to the same optimum.
  head: "mlp_small"
