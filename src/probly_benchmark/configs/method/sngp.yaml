# @package _global_

# SNGP's epistemic scores (mutual information, Brier variance) are three orders of
# magnitude smaller than those of other methods. Under autocast the representation is
# float16, which collapses them to a handful of distinct values and turns the OOD AUROC
# into a tie average. Evaluate in fp32.
amp: false

method:
  name: "sngp"
  label: "SNGP"
  params:
    # Imagenet/CLINC-baseline defaults; see probly.method.sngp.sngp docstring for caveats. Also works for CIFAR10
    num_random_features: 1024
    norm_multiplier: 6.0
    ridge_penalty: 1.0
    # `random_feature_init_std` controls the std of the frozen random projection W_L: 1.0 for cifar10 (non-pretrained),
    # 0.05 for pretrained imagenet
    random_feature_init_std: 1.0

  selective_prediction:
    num_samples: 100
  ood_detection:
    num_samples: 100
  active_learning:
    num_samples: 100
