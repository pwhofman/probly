# A GitHub Actions workflow file to run on pull request events.
name: Pull Request Checks

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # ----------------------------------------------------------------------------------------------
    # Code Quality Checks
    # ----------------------------------------------------------------------------------------------
    check_code_quality:
        name: Code Quality Checks
        # Skip draft PRs; runs on ready-for-review, push, and dispatch.
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
                with:
                    persist-credentials: false
            -   name: Set up Python and uv
                uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
                with:
                    python-version: "3.13"
                    enable-cache: true
            -   name: Run code-quality checks
                run: uv run prek run --all-files --show-diff-on-failure
    # ----------------------------------------------------------------------------------------------
    # Install and Import Check
    # ----------------------------------------------------------------------------------------------
    install_and_import:
        name: Install and Import Check (py${{ matrix.python-version }})
        # Skip draft PRs; runs on ready-for-review, push, and dispatch.
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Oldest and newest supported interpreter; installs from the
                # project metadata, so it also catches a requires-python that
                # no longer matches what the code needs.
                python-version: ["3.12", "3.13"]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
                with:
                    persist-credentials: false
            -   name: Set up Python and uv
                uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
                with:
                    python-version: ${{ matrix.python-version }}
                    enable-cache: true
            -   name: Create uv virtual environment
                run: uv venv
            -   name: Install probly package
                run: uv run --no-sync uv pip install .
            -   name: Test import
                run: uv run --no-sync python -c "import sys, probly; print(f'✅ probly imported successfully on Python {sys.version.split()[0]}')"
    # ----------------------------------------------------------------------------------------------
    # Unit Tests with Matrix
    # ----------------------------------------------------------------------------------------------
    run_unit_tests:
        name: Tests (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.dependency-group }})
        # Skip draft PRs; runs on ready-for-review, push, and dispatch.
        if: github.event.pull_request.draft == false
        strategy:
            fail-fast: false
            # Both ends of the supported range (see project.requires-python) are
            # covered on Linux; the other operating systems run the newest only.
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: "3.12"
                      dependency-group: torch
                    - os: ubuntu-latest
                      python-version: "3.12"
                      dependency-group: jax
                    - os: ubuntu-latest
                      python-version: "3.12"
                      dependency-group: river
                    - os: ubuntu-latest
                      python-version: "3.12"
                      dependency-group: transformers
                    - os: ubuntu-latest
                      python-version: "3.13"
                      dependency-group: torch
                    - os: ubuntu-latest
                      python-version: "3.13"
                      dependency-group: jax
                    - os: ubuntu-latest
                      python-version: "3.13"
                      dependency-group: river
                    - os: ubuntu-latest
                      python-version: "3.13"
                      dependency-group: transformers
                    - os: macos-latest
                      python-version: "3.13"
                      dependency-group: torch
                    - os: macos-latest
                      python-version: "3.13"
                      dependency-group: jax
                    - os: windows-latest
                      python-version: "3.13"
                      dependency-group: torch
                    - os: windows-latest
                      python-version: "3.13"
                      dependency-group: jax
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
                with:
                    persist-credentials: false
            -   name: Run tests
                uses: ./.github/actions/run-tests
                with:
                    python-version: ${{ matrix.python-version }}
                    dependency-group: ${{ matrix.dependency-group }}
                    coverage: "true"
                    coverage-artifact-name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.dependency-group }}
    # ----------------------------------------------------------------------------------------------
    # Code Coverage
    # ----------------------------------------------------------------------------------------------
    upload_coverage:
        name: Upload Coverage
        needs:
            - run_unit_tests
            - check_code_quality
            - install_and_import
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'pwhofman/probly' }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
                with:
                    persist-credentials: false
            -   name: Download all coverage artifacts
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
                with:
                    pattern: coverage-*
                    path: coverage-reports/
            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
                with:
                    directory: coverage-reports/
                    fail_ci_if_error: true
