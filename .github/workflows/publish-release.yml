# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Release
on:
  release:
    types: [published]
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        # setuptools-scm derives the package version from the release tag,
        # which needs the full history to be reachable.
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - name: Set up uv
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
      with:
        python-version: "3.13"
        enable-cache: false
    - name: Generate type stubs
      run: uv run --locked --group lint python scripts/generate_stubs.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Verify built version matches the release tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'EOF'
        import glob
        import os
        import sys

        [wheel] = glob.glob("dist/*.whl")
        version = os.path.basename(wheel).split("-")[1]
        tag = os.environ["TAG"]
        if f"v{version}" != tag:
            sys.exit(f"built version {version} does not match release tag {tag}; refusing to publish")
        print(f"built version {version} matches release tag {tag}")
        EOF
    - name: Verify wheel ships type stubs
      run: |
        python - <<'EOF'
        import glob
        import sys
        import zipfile

        [wheel] = glob.glob("dist/*.whl")
        names = zipfile.ZipFile(wheel).namelist()
        stubs = [name for name in names if name.endswith(".pyi")]
        has_marker = "probly/py.typed" in names
        print(f"{wheel}: {len(stubs)} .pyi files, py.typed present: {has_marker}")
        if not stubs or not has_marker:
            sys.exit("wheel is missing type stubs or the py.typed marker; refusing to publish")
        EOF
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
