# E3 second model family (SmolLM2, Llama architecture) on the same 200 TriviaQA questions.
model: smollm2-1.7b
dataset: triviaqa
n: 200
precision: float32
device: mps
methods: [msp, likelihood_mean, mean_token_entropy, lexical_similarity, dummy_random]  # cache-only; others run on these caches later
